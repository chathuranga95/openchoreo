name: Test Slack Notification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    uses: ./.github/workflows/slack-notify-failure.yml
    with:
      suite: End-to-End Tests
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
